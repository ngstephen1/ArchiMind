[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archimind"
version = "0.1.0"
description = "Foundation for a multi-agent interior design and spatial planning prototype."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.66.1",
    "pydantic==2.14.1",
    "plotly==7.1.0",
    "shapely==2.2.0",
    "langgraph==1.2.18",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.3", "build==1.6.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["archimind*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
archimind = ["pyproject.toml", "_viewer_assets/*", "_viewer_assets/furniture/*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
