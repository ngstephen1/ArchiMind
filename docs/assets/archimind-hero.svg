    <text x="112" y="87" fill="#8DA7AE" font-size="10.5" letter-spacing="1.2">ADS 5984 · ENGINEERING PROTOTYPE</text>
    <text x="48" y="181" fill="#F1F5F1" font-size="80" font-weight="700" letter-spacing="-4">ArchiMind</text>
    <rect x="414" y="132" width="64" height="49" rx="12" fill="#D6B78B"/>
    <text x="446" y="166" fill="#14252D" font-size="26" font-weight="700" text-anchor="middle">AI</text>
    <text x="52" y="232" fill="#CADBD8" font-size="24">Multi-Agent Interior Design</text>
    <text x="52" y="264" fill="#CADBD8" font-size="24">&amp; 3D Spatial Planning</text>
    <text x="52" y="312" fill="#91A8AF" font-size="16">Thoughtful spaces. Structured foundations.</text>
    <rect x="52" y="357" width="258" height="34" rx="17" fill="#173D39" stroke="#32675A"/>
    <circle cx="70" cy="374" r="3.5" fill="#77E0BB"/>
    <text x="83" y="378" fill="#BCE7D7" font-size="10.5" font-weight="600" letter-spacing="0.6">TASK 06B / 3D FURNITURE</text>
    <text x="331" y="378" fill="#97ADB1" font-size="11" class="mono">schema first. space next.</text>
