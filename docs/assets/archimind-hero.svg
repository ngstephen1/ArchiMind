      <circle cx="922" cy="48" r="3" opacity="0"><animate attributeName="r" values="3;13" begin="2s" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0" begin="2s" dur="4s" repeatCount="indefinite"/></circle>
