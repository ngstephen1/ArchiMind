    <!-- Native SVG animation; meaningful artwork remains visible without it. -->
    <g class="motion" clip-path="url(#floor)">
      <path d="M830 308 1003 207" fill="none" stroke="url(#scan)" stroke-width="18" opacity="0.35" filter="url(#glow)"><animateTransform attributeName="transform" type="translate" values="-150 -62;150 62;-150 -62" dur="9s" repeatCount="indefinite"/></path>
      <path d="M830 308 1003 207" fill="none" stroke="url(#scan)" stroke-width="1.5" opacity="0.8"><animateTransform attributeName="transform" type="translate" values="-150 -62;150 62;-150 -62" dur="9s" repeatCount="indefinite"/></path>
      <path d="M750 269 960 356 1132 253 922 168Z" fill="none" stroke="#B2F3DD" stroke-width="2" stroke-dasharray="32 760"><animate attributeName="stroke-dashoffset" from="0" to="-1584" dur="12s" repeatCount="indefinite"/></path>
    </g>
    <g class="motion" fill="none" stroke="#8DE4CB">
