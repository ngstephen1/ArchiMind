<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">ArchiMind AI — Multi-Agent Interior Design and 3D Spatial Planning</title>
  <desc id="description">An animated architectural blueprint with an isometric bedroom, a moving scan line, and pulsing survey points. Task 06B: interactive 3D furnished room. Concept illustration, not application output.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0B1725"/><stop offset="1" stop-color="#112C36"/></linearGradient>
    <linearGradient id="floor-fill" x2="1" y2="1"><stop stop-color="#14343E"/><stop offset="1" stop-color="#102531"/></linearGradient>
    <linearGradient id="wall-fill" x2="1" y2="1"><stop stop-color="#21404B" stop-opacity="0.8"/><stop offset="1" stop-color="#142E39" stop-opacity="0.5"/></linearGradient>
    <linearGradient id="scan" x2="1"><stop stop-color="#60DEC4" stop-opacity="0"/><stop offset="0.5" stop-color="#A2F6E3"/><stop offset="1" stop-color="#60DEC4" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7CABA8" stroke-opacity="0.07"/></pattern>
    <clipPath id="frame"><rect width="1200" height="440" rx="24"/></clipPath>
    <clipPath id="floor"><path d="M750 269 960 356 1132 253 922 168Z"/></clipPath>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
  </style>
  <g clip-path="url(#frame)">
