version: 2
updates:
  # The root project pins the app and test tools. Town's hosted API and worker
  # also install from services/town/requirements.txt.
  - package-ecosystem: pip
    directories:
      - "/"
      - "/services/town"
    schedule:
      interval: weekly

  # Three.js and esbuild produce the viewer shipped in the Python package.
  # Review the lockfile change with the rebuilt viewer and its CI checks.
  - package-ecosystem: npm
    directory: "/frontend/realistic_viewer"
    schedule:
      interval: weekly

  # CI pins actions by commit SHA. Track new upstream releases so those pins
  # receive updates through the same review process as application dependencies.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
