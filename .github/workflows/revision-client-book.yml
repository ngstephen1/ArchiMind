name: Print a reviewed revision book
on:
  workflow_dispatch:
    inputs:
      before_run:
        description: Successful original Studio Home proof run
        required: true
      after_run:
        description: Successful edited Studio Home proof run
        required: true
      before_eye_run:
        description: Optional approved before photography run (supply both)
      after_eye_run:
        description: Optional approved after photography run (supply both)
      reviewed_book_run:
        description: Successful book run to package without reprinting
      inspection_source:
        description: Approved page inspection as exact commit and docs/data path (commit:path)
      release_commit:
        description: Full release SHA recorded in the designer handoff
permissions:
  contents: read
  actions: read
jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify and download the selected Blender runs
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ inputs.before_run }}
          AFTER: ${{ inputs.after_run }}
          OLD_PHOTOS: ${{ inputs.before_eye_run }}
          NEW_PHOTOS: ${{ inputs.after_eye_run }}
        run: |
          set -euo pipefail
          workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/studio-home.yml" --jq '.id')
          fetch() {
            local run="$1" name="$2" directory="$3"
            [[ "$run" =~ ^[0-9]+$ ]]
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '[.workflow_id|tostring]+[.conclusion]|join(" ")')" = "$workflow success"
            gh run download "$run" -n "$name" -D "$RUNNER_TEMP/$directory"
          }
          fetch "$BEFORE" studio-home-proof before
          if [[ "$BEFORE" == "$AFTER" ]]; then
            fetch "$AFTER" studio-home-edited-proof after
          else
            fetch "$AFTER" studio-home-proof after
          fi
          if [[ -n "$OLD_PHOTOS" || -n "$NEW_PHOTOS" ]]; then
            fetch "$OLD_PHOTOS" studio-eye-views old-photos
            fetch "$NEW_PHOTOS" studio-eye-views new-photos
          fi
      - name: Print the portfolio and revision comparison
        if: ${{ !inputs.reviewed_book_run }}
        run: |
          set -euo pipefail
          options=()
          if [[ -d "$RUNNER_TEMP/old-photos" ]]; then
            options+=(--eye-views "$RUNNER_TEMP/old-photos" "$RUNNER_TEMP/new-photos")
          fi
          command -v pdfunite || { sudo apt-get update -qq && sudo apt-get install -y poppler-utils; }
          python scripts/print_revision_book.py "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" \
            "$RUNNER_TEMP/output/Client-Book.pdf" "${options[@]}"
          pdftoppm -scale-to 600 -jpeg "$RUNNER_TEMP/output/Client-Book.pdf" "$RUNNER_TEMP/output/sheet"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        if: inputs.reviewed_book_run
        with:
          python-version: "3.11"
      - name: Package the already reviewed book and the edited Blender scene
        if: inputs.reviewed_book_run
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_BOOK: ${{ inputs.reviewed_book_run }}
          INSPECTION: ${{ inputs.inspection_source }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_BOOK" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_COMMIT" --jq .sha)" = "$RELEASE_COMMIT"
          [[ "$INSPECTION" =~ ^([0-9a-f]{40}):(docs/data/[a-z0-9/_-]+/book-inspection[.]json)$ ]]
          inspection_commit="${BASH_REMATCH[1]}"
          inspection_path="${BASH_REMATCH[2]}"
          test -d "$RUNNER_TEMP/old-photos"
          test -d "$RUNNER_TEMP/new-photos"
          workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/revision-client-book.yml" --jq '.id')
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWED_BOOK" --jq '[.workflow_id|tostring]+[.conclusion]|join(" ")')" = "$workflow success"
          gh run download "$REVIEWED_BOOK" -n revision-client-book -D "$RUNNER_TEMP/reviewed"
          gh api "repos/$GITHUB_REPOSITORY/contents/$inspection_path?ref=$inspection_commit" \
            -H "Accept: application/vnd.github.raw+json" > "$RUNNER_TEMP/book-inspection.json"
          python - "$RUNNER_TEMP" <<'PYTHON'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          reviewed = json.loads((root / "book-inspection.json").read_bytes())
          rows = reviewed.pop("inspection")
          assert rows and all(isinstance(row, dict) and row.get("page") for row in rows)
          original = json.loads((root / "reviewed/Client-Book.json").read_bytes())
          assert reviewed == original, "The approved receipt must only add page inspection rows."
          PYTHON
          command -v pdfinfo || { sudo apt-get update -qq && sudo apt-get install -y poppler-utils; }
          python -m pip install -e .
          mkdir "$RUNNER_TEMP/output"
          python scripts/package_town_release.py "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" \
            "$RUNNER_TEMP/new-photos" "$RUNNER_TEMP/reviewed/Client-Book.pdf" \
            "$RUNNER_TEMP/book-inspection.json" "$RUNNER_TEMP/output/Designer-Handoff.zip" \
            --commit "$RELEASE_COMMIT"
          cp "$RUNNER_TEMP/reviewed/Client-Book.pdf" "$RUNNER_TEMP/output/Client-Book.pdf"
          cp "$RUNNER_TEMP/book-inspection.json" "$RUNNER_TEMP/output/book-inspection.json"
          cd "$RUNNER_TEMP/output"
          sha256sum Client-Book.pdf Designer-Handoff.zip book-inspection.json > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.reviewed_book_run && 'town-designer-release' || 'revision-client-book' }}
          path: ${{ runner.temp }}/output
          if-no-files-found: error
