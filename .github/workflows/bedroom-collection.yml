name: Bedroom furniture authoring
on:
  workflow_dispatch:
  push:
    branches: [feat/bedroom-collection]
    paths: [scripts/author_bedroom_collection.py, scripts/author_designer_chair.py, .github/workflows/bedroom-collection.yml]
permissions:
  contents: read
jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install pinned Blender in the operator workspace
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          url=https://download.blender.org/release/Blender5.1/blender-5.1.2-linux-x64.tar.xz
          curl --fail --location --retry 2 "$url" -o blender.tar.xz
          echo 'aaccb355f50183979b698bcce7467103a76261b5fa59f4972295842662a285fb  blender.tar.xz' | sha256sum -c
          tar xf blender.tar.xz
          echo "BLENDER_BIN=$RUNNER_TEMP/blender-5.1.2-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Author and reopen the collection
        run: '"$BLENDER_BIN" --background --factory-startup --python-exit-code 1 --python scripts/author_bedroom_collection.py -- "$RUNNER_TEMP/collection"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bedroom-furniture
          path: ${{ runner.temp }}/collection
          if-no-files-found: error
