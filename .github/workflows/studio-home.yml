name: Studio home proof
on:
  workflow_dispatch:
    inputs:
      finish_study:
        description: Render only the November fixed-camera bedroom and salon finish comparison
        type: boolean
        default: false
      finish_proof_only:
        description: For the finish study, verify the packed geometry and all editable cameras without rendering
        type: boolean
        default: false
      fresh_home:
        description: Render the fresh-home acceptance manifest only
        type: boolean
        default: false
      manifest_source:
        description: Optional pinned 40-hex-commit:docs/data/file.json from this repository (fresh_home only)
        type: string
      snapshot_source:
        description: Optional pinned original Town snapshot for high-tier furniture and dressing
        type: string
      approved_proof_run:
        description: Accepted fresh-home proof run ID for a two-view 1080p render
        type: string
      lighting_proof:
        description: Reopen a checked scene for fixed-camera daylight and task-lighting proofs at 960 × 540
        type: boolean
        default: false
      salon_cover:
        description: Also render the saved salon camera for the final client cover
        type: boolean
        default: false
      camera_source:
        description: Optional pinned camera manifest for a matched comparison (same project and shell)
        type: string
  push:
    branches: [feat/whole-home-client-studio]
    paths:
      - scripts/*studio_home.py
      - scripts/publish_studio_board.py
      - scripts/render_saved_bedroom.py
      - scripts/render_town_templates.py
      - scripts/render_saved_style.py
      - frontend/realistic_viewer/town/export-saved-style.mjs
      - .github/workflows/studio-home.yml
      - src/archimind/town/design.py
      - frontend/realistic_viewer/town/bedroom_cameras.js
      - frontend/realistic_viewer/town/studio_furniture.js
      - frontend/realistic_viewer/town/studio_textiles.js
      - frontend/realistic_viewer/town/home_board.js
permissions:
  contents: read
  actions: read
jobs:
  render:
    if: ${{ !inputs.finish_study }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check conference render inputs
        if: inputs.approved_proof_run || inputs.manifest_source || inputs.camera_source || inputs.snapshot_source || inputs.lighting_proof
        env:
          FRESH: ${{ inputs.fresh_home }}
          PROOF_RUN: ${{ inputs.approved_proof_run }}
          CAMERA: ${{ inputs.camera_source }}
          LIGHTING_PROOF: ${{ inputs.lighting_proof }}
        run: |
          test "$FRESH" = true
          if [ -n "$CAMERA" ] || [ "$LIGHTING_PROOF" = true ]; then test -n "$PROOF_RUN"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned Blender binary
        working-directory: ${{ runner.temp }}
        run: |
          name=blender-5.1.2-linux-x64.tar.xz
          curl -fsSL --retry 2 "https://download.blender.org/release/Blender5.1/$name" -o blender.tar.xz ||
            curl -fsSL --retry 2 "https://ftp.halifax.rwth-aachen.de/blender/release/Blender5.1/$name" -o blender.tar.xz
          echo 'aaccb355f50183979b698bcce7467103a76261b5fa59f4972295842662a285fb  blender.tar.xz' | sha256sum -c
          tar xf blender.tar.xz
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "20"
      - name: Stage the fresh-home manifest
        if: inputs.fresh_home
        env:
          MANIFEST_SOURCE: ${{ inputs.manifest_source }}
        run: |
          if [ -n "$MANIFEST_SOURCE" ]; then
            python scripts/stage_studio_manifest.py "$MANIFEST_SOURCE" "$RUNNER_TEMP/manifest.json"
          else
            cp docs/data/fresh-home/before.json "$RUNNER_TEMP/manifest.json"
          fi
      - name: Resolve high-tier style placements from the exact saved Town snapshot
        if: inputs.snapshot_source
        env:
          SNAPSHOT_SOURCE: ${{ inputs.snapshot_source }}
          APPROVED_PROOF: ${{ inputs.approved_proof_run }}
        run: |
          python scripts/stage_studio_manifest.py "$SNAPSHOT_SOURCE" "$RUNNER_TEMP/snapshot.json" --snapshot
          if [ -z "$APPROVED_PROOF" ]; then
            npm ci --prefix frontend/realistic_viewer --ignore-scripts
            node frontend/realistic_viewer/town/export-saved-style.mjs "$RUNNER_TEMP/snapshot.json" "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/saved-style.json"
          fi
      - name: Replay applied studio home and export the scene
        if: ${{ !inputs.fresh_home }}
        run: |
          python -m pip install -e . -r services/town/requirements.txt
          npm ci --prefix frontend/realistic_viewer --ignore-scripts
          python scripts/run_studio_home.py --export "$RUNNER_TEMP/saved.json"
          node frontend/realistic_viewer/town/export-home.mjs "$RUNNER_TEMP/saved.json" "$RUNNER_TEMP/manifest.json"
      - name: Reopen an accepted proof for camera-matched eye-level images
        if: inputs.approved_proof_run
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_RUN: ${{ inputs.approved_proof_run }}
          CAMERA_SOURCE: ${{ inputs.camera_source }}
          SALON_COVER: ${{ inputs.salon_cover }}
          LIGHTING_PROOF: ${{ inputs.lighting_proof }}
        run: |
          [[ "$PROOF_RUN" =~ ^[0-9]+$ ]]
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/studio-home.yml" --jq .id)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROOF_RUN" --jq '[.conclusion,(.workflow_id|tostring)]|join(" ")')" = "success $workflow_id"
          gh run download "$PROOF_RUN" --name studio-home-proof --dir "$RUNNER_TEMP/accepted"
          if [ -n "$CAMERA_SOURCE" ]; then
            python scripts/stage_studio_manifest.py "$CAMERA_SOURCE" "$RUNNER_TEMP/camera.json"
          else
            cp "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/camera.json"
          fi
          options=()
          if [ "$SALON_COVER" = true ]; then options+=(--salon-cover); fi
          if [ "$LIGHTING_PROOF" = true ]; then options+=(--lighting-proof); fi
          if [ -f "$RUNNER_TEMP/snapshot.json" ]; then options+=(--expected-snapshot "$RUNNER_TEMP/snapshot.json"); fi
          "$RUNNER_TEMP/blender-5.1.2-linux-x64/blender" -b --factory-startup --disable-autoexec --python-exit-code 1 -P scripts/render_studio_eye_views.py -- "$RUNNER_TEMP/accepted" "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/camera.json" "$RUNNER_TEMP/eye-views" "${options[@]}"
          if [ "$LIGHTING_PROOF" = true ]; then exit 0; fi
          python scripts/publish_studio_board.py "$RUNNER_TEMP/accepted" --eye-views "$RUNNER_TEMP/eye-views"
          google-chrome --headless --disable-gpu --no-sandbox --no-pdf-header-footer --print-to-pdf="$RUNNER_TEMP/eye-views/Studio-House-Presentation.pdf" "file://$RUNNER_TEMP/accepted/index.html"
          test -s "$RUNNER_TEMP/eye-views/Studio-House-Presentation.pdf"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.approved_proof_run
        with:
          name: studio-eye-views
          path: ${{ runner.temp }}/eye-views
          if-no-files-found: error
      - name: Reopen the editable scene and render every room
        if: ${{ !inputs.approved_proof_run }}
        run: |
          options=()
          if [ -f "$RUNNER_TEMP/saved-style.json" ]; then options+=(--saved-style "$RUNNER_TEMP/saved-style.json"); fi
          "$RUNNER_TEMP/blender-5.1.2-linux-x64/blender" -b --factory-startup --python-exit-code 1 -P scripts/render_studio_home.py -- "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/proof" --proof "${options[@]}"
      - name: Make the revision-bound client book and print to PDF
        if: ${{ !inputs.approved_proof_run }}
        run: |
          python scripts/publish_studio_board.py "$RUNNER_TEMP/proof"
          google-chrome --headless --disable-gpu --no-sandbox --no-pdf-header-footer --print-to-pdf="$RUNNER_TEMP/proof/Studio-House.pdf" "file://$RUNNER_TEMP/proof/index.html"
          test -s "$RUNNER_TEMP/proof/Studio-House.pdf"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !inputs.approved_proof_run }}
        with:
          name: studio-home-proof
          path: ${{ runner.temp }}/proof
          if-no-files-found: error

      - name: Replay a chair and palette edit and render the next revision independently
        if: ${{ !inputs.fresh_home }}
        run: |
          python scripts/run_studio_home.py --edited --export "$RUNNER_TEMP/edited.json"
          node frontend/realistic_viewer/town/export-home.mjs "$RUNNER_TEMP/edited.json" "$RUNNER_TEMP/edited-board.json"
          "$RUNNER_TEMP/blender-5.1.2-linux-x64/blender" -b --factory-startup --python-exit-code 1 -P scripts/render_studio_home.py -- "$RUNNER_TEMP/edited-board.json" "$RUNNER_TEMP/edited-proof" --proof
          python scripts/publish_studio_board.py "$RUNNER_TEMP/edited-proof"
          google-chrome --headless --disable-gpu --no-sandbox --no-pdf-header-footer --print-to-pdf="$RUNNER_TEMP/edited-proof/Studio-House.pdf" "file://$RUNNER_TEMP/edited-proof/index.html"
          python - "$RUNNER_TEMP" <<'PYTHON'
          import json, sys
          from pathlib import Path
          original, edited = [
              json.loads((Path(sys.argv[1]) / name / "receipt.json").read_bytes())
              for name in ("proof", "edited-proof")
          ]
          assert (original["revision"], edited["revision"]) == (5, 6)
          assert original["home_id"] != edited["home_id"]
          assert original["files"]["bedroom-desk.png"] != edited["files"]["bedroom-desk.png"]
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !inputs.fresh_home }}
        with:
          name: studio-home-edited-proof
          path: ${{ runner.temp }}/edited-proof
          if-no-files-found: error

  finish-study:
    if: inputs.finish_study
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned Blender binary
        working-directory: ${{ runner.temp }}
        run: |
          name=blender-5.1.2-linux-x64.tar.xz
          curl -fsSL --retry 2 "https://download.blender.org/release/Blender5.1/$name" -o blender.tar.xz ||
            curl -fsSL --retry 2 "https://ftp.halifax.rwth-aachen.de/blender/release/Blender5.1/$name" -o blender.tar.xz
          echo 'aaccb355f50183979b698bcce7467103a76261b5fa59f4972295842662a285fb  blender.tar.xz' | sha256sum -c
          tar xf blender.tar.xz
      - name: Fetch the frozen public baseline artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44993303088 --name studio-home-proof --dir "$RUNNER_TEMP/finish-source"
          gh run download 44994306268 --name studio-eye-views --dir "$RUNNER_TEMP/finish-before"
      - name: Render matched bedroom and salon finish proofs
        env:
          FINISH_PROOF_ONLY: ${{ inputs.finish_proof_only }}
        run: |
          options=()
          if [[ "$FINISH_PROOF_ONLY" == "true" ]]; then options+=(--proof-only); fi
          "$RUNNER_TEMP/blender-5.1.2-linux-x64/blender" -b --factory-startup --disable-autoexec --python-exit-code 1 -P scripts/render_studio_finish_study.py -- \
            "$RUNNER_TEMP/finish-source" "$RUNNER_TEMP/finish-before" \
            docs/data/nov24-baseline/visual-baseline.json "$RUNNER_TEMP/finish-study" "${options[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-finish-study
          path: ${{ runner.temp }}/finish-study
          if-no-files-found: error
