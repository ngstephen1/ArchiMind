name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  checks:
    name: Project checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint Python
        run: python -m ruff check --output-format=github .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Check dependency compatibility
        run: python -m pip check
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20.13.1"
          cache: npm
          cache-dependency-path: frontend/realistic_viewer/package-lock.json
      - name: Check isolated realistic viewer
        working-directory: frontend/realistic_viewer
        run: |
          npm ci --ignore-scripts --no-fund
          npm run check
          npm test
          npm run build
          git diff --exit-code -- ../../src/archimind/_viewer_assets
      - name: Run package and Streamlit application tests
        run: python -m pytest -q
      - name: Check headless Streamlit server
        run: python scripts/check_health.py
