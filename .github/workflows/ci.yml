name: CI

on:
  push:
    branches: [main, stephen-develop]
  pull_request:
    branches: [main, stephen-develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint Python
        run: python -m ruff check --output-format=github .
      - name: Check formatting
        run: python -m ruff format --check .

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run package and Streamlit application tests
        run: python -m pytest -q
      - name: Check headless Streamlit server
        run: python scripts/check_health.py

  build:
    name: Build and verify distributions
    needs: [quality, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tooling
        run: python -m pip install -e ".[dev]"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify application sources are included
        run: |
          python - <<'PY'
          import tarfile
          from pathlib import Path

          with tarfile.open(next(Path("dist").glob("*.tar.gz"))) as archive:
              names = set(archive.getnames())
              root = archive.getnames()[0]
              for path in ("app.py", "scripts/check_health.py", "tests/test_smoke.py"):
                  assert f"{root}/{path}" in names, f"Missing source file: {path}"
          print("Application sources are present in the source distribution")
          PY
      - name: Verify wheel installation in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/archimind-wheel"
          "$RUNNER_TEMP/archimind-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/archimind-wheel/bin/python" -m pip check
          "$RUNNER_TEMP/archimind-wheel/bin/python" -I -c \
            'import archimind; from importlib.metadata import version; assert archimind.__version__ == version("archimind"); print("Installed wheel imports successfully")'
      - name: Upload verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archimind-distributions-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
